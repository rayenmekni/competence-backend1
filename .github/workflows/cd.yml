name: CD Backend

on:
  workflow_run:
    workflows: ["CI Backend"]
    types:
      - completed
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 📥 CHECKOUT CODE
      - name: Checkout code
        uses: actions/checkout@v4

      # 📦 DOWNLOAD JAR ARTIFACT
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # 🔐 LOGIN TO DOCKER HUB
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🏗️ SET UP DOCKER BUILDX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🐳 BUILD AND PUSH DOCKER IMAGE
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/competence-backend1:latest
            ${{ secrets.DOCKER_USERNAME }}/competence-backend1:${{ github.sha }}

      # ✅ LOG SUCCESS
      - name: Log Docker image details
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "📦 Image: ${{ secrets.DOCKER_USERNAME }}/competence-backend1"
          echo "🏷️ Tags: latest, ${{ github.sha }}"
          echo "🔗 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/competence-backend1"
