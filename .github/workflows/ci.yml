name: CI Backend

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: Competence
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 🔥 FIX MVNW (très important)
      - name: Fix mvnw
        run: |
          chmod +x mvnw
          sed -i 's/\r$//' mvnw

      # 🔥 ATTEND QUE MYSQL SOIT READY
      - name: Wait for MySQL
        run: sleep 15

      # 🚀 TESTS
      - name: Run tests
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/Competence
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

      # 📊 COVERAGE REPORT
      - name: Generate JaCoCo coverage report
        run: ./mvnw jacoco:report

      # 🔍 SONARCLOUD ANALYSIS
      - name: SonarCloud analysis
        run: ./mvnw sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 📦 BUILD JAR
      - name: Build JAR artifact
        run: ./mvnw package -DskipTests

      # ⬆️ UPLOAD ARTIFACT
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 90
